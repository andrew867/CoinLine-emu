# Fixture schema validation tests.

name: Fixtures

on:
  push:
    branches: [main]
    paths:
      - "fixtures/**"
      - "tests/fixtures/**"
      - "requirements-dev.txt"
      - ".github/workflows/fixtures.yml"
  pull_request:
    branches: [main]
    paths:
      - "fixtures/**"
      - "tests/fixtures/**"
      - "requirements-dev.txt"
      - ".github/workflows/fixtures.yml"

permissions:
  contents: read

jobs:
  pytest-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Run fixture schema tests
        run: pytest tests/fixtures -q
