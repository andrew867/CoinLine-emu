[line]
ncc_port = 4000
code_server_number =
code_server_port = 0
# Local central-office test number.
outbound_digits = 18005551212

[audio]
# Set false to keep the handset microphone input silent without opening a host device.
capture_enabled = true
# Optional unique prefix of a host recording device name. Blank uses the default.
input_device =
playback_buffer_ms = 240

[display]
window_scale = 1.0
window_maximized = false
max_frameskip = 11

[performance]
# Windows only, normal or above-normal (never real-time).
host_priority = above-normal

[hardware]
profile = auto
display = 11line
flash = firmware/graphical/flash.bin
flash1 =
rompath = roms
# Optional later-board data-jack monitor/relay wiring; keep disabled until selected.
data_jack_profile = disabled
data_jack_monitor_polarity =
portable_display = attached

[cards]
mag_fixture =
# Empty selects the registered image's qualified default contact fixture.
smart_fixture =
# Optional later-board generic read-only internal contact fixtures.
# For full graphical contact tests: fixtures/cards/smartcard-async-contact-atr-lab.json
sam_slot0 =
sam_slot1 =
sam_slot2 =

[adsi]
# Optional exact local InfoLine route. Never falls through to the PSTN.
# adsi-routes.ini, if present, replaces this section for both profiles.
enabled = false
host = 127.0.0.1
dial_digits = 2374,7095550174,17095550174
target = 2374
port = 5069

[sip]
# Separate account and SIP port from the 2-line terminal.
registrar =
registrar_port = 5060
username =
password =
local_port = 5088
local_address =
rtp_public_address =
# Zero permits the graphical profile's default dynamic RTP range.
rtp_port = 0
dtmf_mode = auto
