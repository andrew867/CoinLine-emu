[line]
ncc_port = 4000
# Optional local data modem route for code-server calls. Set both or leave disabled.
code_server_number =
code_server_port = 0
# Local central-office test number.
outbound_digits = 18005551212

[audio]
# Optional unique prefix of a Windows recording device name. Blank uses the default.
input_device =

[hardware]
# auto chooses from the verified program image. Command-line options override these values.
profile = auto
# The 11line expansion requires compatible graphical firmware and a later control board.
display = auto
flash = firmware/oem/flash.bin
# Optional second 512 KiB flash chip, after the boot chip in flash.
flash1 =
rompath = roms
# Coin Basic only: temporary VFD connection at power-on.
portable_display = attached

[sip]
# Fill in all three credentials to enable SIP calling. Use --local to simulate calls.
registrar =
registrar_port = 5060
# Account name before @, or its SIP address at the registrar above.
username =
password =
local_port = 5087
local_address =
# Optional public IPv4 for RTP. Blank uses the address reported by the registrar.
rtp_public_address =
# Optional fixed local UDP media port. Zero uses a dynamic port.
rtp_port = 0
