[line]
ncc_port = 4000
# Optional local data modem route for code-server calls. Set both or leave disabled.
code_server_number =
code_server_port = 0
# Local central-office test number.
outbound_digits = 18005551212

[audio]
# Set false to keep the handset microphone input silent without opening a host device.
capture_enabled = true
# Optional unique prefix of a host recording device name. Blank uses the default.
input_device =
# Host speaker buffer only; does not change analogue or SIP timing.
playback_buffer_ms = 240

[display]
# Initial window size, 2.0 is useful on a 4K display.
window_scale = 1.0
window_maximized = false
# Allow automatic artwork frame skipping under CPU pressure.
max_frameskip = 10

[performance]
# Windows only, normal or above-normal (never real-time).
host_priority = above-normal

[hardware]
# auto chooses from the verified program image. Command-line options override these values.
profile = auto
# The 11line expansion requires compatible graphical firmware and a later control board.
display = auto
flash = firmware/oem/flash.bin
# Optional second 512 KiB flash chip, after the boot chip in flash.
flash1 =
rompath = roms
# Optional later-board data-jack monitor/relay wiring; keep disabled until selected.
data_jack_profile = disabled
data_jack_monitor_polarity =
# Coin Basic only: temporary VFD connection at power-on.
portable_display = attached

[cards]
# Local synthetic fixtures; leave blank for the packaged reader test cards.
mag_fixture =
smart_fixture =
# Optional additional read-only contact and synthetic magnetic fixtures (slots 2 through 8).
# Omit slot 2 to use the packaged alternative; set it empty to disable cycling.
# mag_fixture_2 = fixtures/cards/magcard-invalid-lrc.json
# smart_fixture_2 = fixtures/cards/smartcard-async-contact-atr-lab.json
# Optional later-board generic read-only internal contact fixtures.
sam_slot0 =
sam_slot1 =
sam_slot2 =

[adsi]
# Optional exact local InfoLine route. Never falls through to the PSTN.
# adsi-routes.ini, if present, replaces this section for both profiles.
enabled = false
host = 127.0.0.1
dial_digits = 2374,7095550174,17095550174
target = 2374
port = 5069

[sip]
# Fill in all three credentials to enable SIP calling. Use --local to simulate calls.
registrar =
registrar_port = 5060
# Account name before @, or its SIP address at the registrar above.
username =
password =
local_port = 5087
local_address =
# Optional public IPv4 for RTP. Blank uses the address reported by the registrar.
rtp_public_address =
# Optional fixed local UDP media port. Zero uses this profile's dynamic range.
rtp_port = 0
# auto prefers negotiated RFC 4733 telephone events, then explicitly supported
# legacy SIP INFO, otherwise in-band audio. Use info only for a known peer.
dtmf_mode = auto
